.rule_tag: &rule_tag
  if: "$CI_COMMIT_TAG"

.rule_tag_manual: &rule_tag_manual
  <<: *rule_tag
  when: manual
  allow_failure: true

.rule_default_branch: &rule_default_branch
  if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

.rule_default_branch_manual: &rule_default_branch_manual
  <<: *rule_default_branch
  when: manual
  allow_failure: true

.rule_mr: &rule_mr
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rule_mr_manual: &rule_mr_manual
  <<: *rule_mr
  when: manual
  allow_failure: true

.rule_web: &rule_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rule_web_manual: &rule_web_manual
  <<: *rule_web
  when: manual
  allow_failure: true

.rules_always: &rules_always
  - *rule_tag
  - *rule_default_branch
  - *rule_mr
  - *rule_web

.rules_not_tags: &rules_not_tags
  - *rule_default_branch
  - *rule_mr
  - *rule_web

.rules_only_tags_manual: &rules_only_tags_manual
  - *rule_tag_manual

.rules_not_tags_manual: &rules_not_tags_manual
  - *rule_default_branch_manual
  - *rule_mr_manual
  - *rule_web_manual

.exec_matrix: &exec_matrix
  - OS: linux
    ARCH: [x64, arm64]
  - OS: win
    ARCH: [x64]

.update_nuget_source_ro: &update_nuget_source_ro
  - dotnet nuget update source JFrogNuGetProxy --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text

stages:
  - build
  - test
  - pack
  - publish
  - release

include:
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/version/version-calc@v1.2.0
    inputs:
      rules: *rules_always
  # Every module uses the same runtime identifiers, so one job serves them all.
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/runtime-identifier@v0.2.0
    inputs:
      project: "src/OpcUa.Client/OpcUa.Client.csproj"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-restore@v2.7.1
    inputs:
      before_script:
        - *update_nuget_source_ro
      rules: *rules_always
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-artifacts@v2.7.1
    inputs:
      name: "dotnet Build+Test"
      stage: test
      rules: *rules_not_tags
      before_script:
        - *update_nuget_source_ro
      build: true
      test: true
      test_coverage: true
      test_filter: "/[(Category!=System)&(Category!=Integration)&(Category!=Interoperability)]"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-test@v2.7.1
    inputs:
      name: "dotnet Interoperability Test"
      rules: *rules_not_tags
      before_script:
        - *update_nuget_source_ro
      build_job_name: "dotnet Build+Test"
      filter: "/[Category=Interoperability]"
  ### OpcUa.Client
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/metadata@v0.2.0
    inputs:
      name: "OpcUa.Client Metadata"
      stage: build
      rules: *rules_always
      project: "src/OpcUa.Client/OpcUa.Client.csproj"
      module_version: "${Version}"
      metadata_json: "src/OpcUa.Client/metadata.json"
      metadata_dir: "metadata/OpcUa.Client"
      min_core_version_file: "VERSION_CORE"
      min_core_version_property: "MinCoreVersion"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-publish@v2.7.1
    inputs:
      name: "dotnet Publish OpcUa.Client"
      stage: pack
      rules:
        - *rule_tag
        - *rule_default_branch_manual
        - *rule_mr_manual
        - *rule_web_manual
      project: "src/OpcUa.Client/OpcUa.Client.csproj"
      output_directory: "artifacts/OpcUa.Client/${OS}-${ARCH}"
      before_script:
        - *update_nuget_source_ro
        - dotnet restore
      execution_matrix: *exec_matrix
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/package-module@v0.2.0
    inputs:
      name: "Pack OpcUa.Client binaries"
      stage: pack
      rules: *rules_always
      publish_job: "dotnet Publish OpcUa.Client"
      metadata_job: "OpcUa.Client Metadata"
      build_dir: "artifacts/OpcUa.Client"
      metadata_dir: "metadata/OpcUa.Client"
      before_script:
        - apt update
        - apt install jq zip -y
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v2.0.1
    inputs:
      name: "Push OpcUa.Client binaries (dev)"
      stage: publish
      rules: *rules_not_tags_manual
      repository: "vicione-suite-dev"
      upload_path: "fbs/ViciOne.Suite.DataPort.OpcUa.Client"
      needs:
        - "OpcUa.Client Metadata"
        - "Pack OpcUa.Client binaries"
      artifacts:
        - "artifacts/OpcUa.Client/**/*json"
        - "artifacts/OpcUa.Client/**/*zip"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v2.0.1
    inputs:
      name: "Push OpcUa.Client binaries (staging)"
      stage: publish
      rules: *rules_only_tags_manual
      repository: "vicione-suite-staging"
      upload_path: "fbs/ViciOne.Suite.DataPort.OpcUa.Client"
      needs:
        - "OpcUa.Client Metadata"
        - "Pack OpcUa.Client binaries"
      artifacts:
        - "artifacts/OpcUa.Client/**/*json"
        - "artifacts/OpcUa.Client/**/*zip"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/promote@v2.0.1
    inputs:
      name: "Release OpcUa.Client binaries"
      stage: release
      rules: *rules_only_tags_manual
      source_repository: "vicione-suite-staging"
      destination_repository: "vicione-suite"
      remote_path: "fbs/ViciOne.Suite.DataPort.OpcUa.Client"
  ### OpcUa.Server
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/metadata@v0.2.0
    inputs:
      name: "OpcUa.Server Metadata"
      stage: build
      rules: *rules_always
      project: "src/OpcUa.Server/OpcUa.Server.csproj"
      module_version: "${Version}"
      metadata_json: "src/OpcUa.Server/metadata.json"
      metadata_dir: "metadata/OpcUa.Server"
      min_core_version_file: "VERSION_CORE"
      min_core_version_property: "MinCoreVersion"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-publish@v2.7.1
    inputs:
      name: "dotnet Publish OpcUa.Server"
      stage: pack
      rules:
        - *rule_tag
        - *rule_default_branch_manual
        - *rule_mr_manual
        - *rule_web_manual
      project: "src/OpcUa.Server/OpcUa.Server.csproj"
      output_directory: "artifacts/OpcUa.Server/${OS}-${ARCH}"
      before_script:
        - *update_nuget_source_ro
        - dotnet restore
      execution_matrix: *exec_matrix
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/package-module@v0.2.0
    inputs:
      name: "Pack OpcUa.Server binaries"
      stage: pack
      rules: *rules_always
      publish_job: "dotnet Publish OpcUa.Server"
      metadata_job: "OpcUa.Server Metadata"
      build_dir: "artifacts/OpcUa.Server"
      metadata_dir: "metadata/OpcUa.Server"
      before_script:
        - apt update
        - apt install jq zip -y
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v2.0.1
    inputs:
      name: "Push OpcUa.Server binaries (dev)"
      stage: publish
      rules: *rules_not_tags_manual
      repository: "vicione-suite-dev"
      upload_path: "fbs/ViciOne.Suite.DataPort.OpcUa.Server"
      needs:
        - "OpcUa.Server Metadata"
        - "Pack OpcUa.Server binaries"
      artifacts:
        - "artifacts/OpcUa.Server/**/*json"
        - "artifacts/OpcUa.Server/**/*zip"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v2.0.1
    inputs:
      name: "Push OpcUa.Server binaries (staging)"
      stage: publish
      rules: *rules_only_tags_manual
      repository: "vicione-suite-staging"
      upload_path: "fbs/ViciOne.Suite.DataPort.OpcUa.Server"
      needs:
        - "OpcUa.Server Metadata"
        - "Pack OpcUa.Server binaries"
      artifacts:
        - "artifacts/OpcUa.Server/**/*json"
        - "artifacts/OpcUa.Server/**/*zip"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/promote@v2.0.1
    inputs:
      name: "Release OpcUa.Server binaries"
      stage: release
      rules: *rules_only_tags_manual
      source_repository: "vicione-suite-staging"
      destination_repository: "vicione-suite"
      remote_path: "fbs/ViciOne.Suite.DataPort.OpcUa.Server"
